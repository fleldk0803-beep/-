<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>일상생활 1~40차시 전체게임</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#fffaf6;color:#16354b}header{background:#fff;border-bottom:2px solid #ffc0d7;padding:25px 16px;text-align:center}h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px)}p{margin:0;color:#65768a}main{max-width:1150px;margin:24px auto;padding:0 16px}.tools{display:flex;gap:10px;margin-bottom:18px}input{padding:13px 16px;flex:1;border:2px solid #ffb5d1;border-radius:12px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.lesson{border:2px solid #ffd0df;background:#fff;border-radius:15px;padding:17px;display:flex;gap:12px;align-items:center;cursor:pointer;color:#16354b;font-weight:bold;font-size:16px;text-align:left}.lesson:hover{background:#fff0f6;border-color:#ff86af}.num{display:grid;place-items:center;background:#ffe6ee;color:#b83d71;border-radius:10px;width:43px;height:43px;flex-shrink:0}.arrow{margin-left:auto}#viewer{display:none;position:fixed;inset:0;background:#fff;z-index:9}#bar{height:52px;display:flex;align-items:center;gap:12px;padding:8px 12px;background:#fff6fa;border-bottom:1px solid #ffc0d7}#back{background:#fff;border:1px solid #ff8eb7;border-radius:8px;padding:8px 14px;font-weight:bold;cursor:pointer}#frame{width:100%;height:calc(100% - 52px);border:0}#status{color:#9c436b;font-size:13px}</style>
<header><h1>💗 일상생활 플래시게임 1~40차시</h1><p>차시를 선택하면 바로 게임이 열려요. 40차시는 1~39차시 종합 복습입니다. 기존 1~39차시 게임은 그대로 유지했습니다.</p></header><main><div class="tools"><input id="search" placeholder="차시 번호 또는 수업 이름 검색" oninput="filterGames()"></div><div class="grid" id="grid"></div></main>
<div id="viewer"><div id="bar"><button id="back" onclick="closeGame()">← 전체 목록</button><strong id="gameTitle"></strong><span id="status"></span></div><iframe id="frame" title="차시 플래시게임" allow="autoplay"></iframe></div>
<script src="games1.js"></script><script src="games2.js"></script><script>const DATA=[...GAMES1,...GAMES2];let currentURL=null;const grid=document.getElementById('grid');DATA.forEach(d=>{const btn=document.createElement('button');btn.className='lesson';btn.dataset.search=d.n+'차시 '+d.title;btn.innerHTML='<span class="num">'+String(d.n).padStart(2,'0')+'</span><span>'+d.title+'</span><span class="arrow">↗</span>';btn.onclick=()=>openGame(d);grid.append(btn)});
function filterGames(){const s=document.getElementById('search').value.trim().toLowerCase();[...grid.children].forEach(el=>el.hidden=!el.dataset.search.toLowerCase().includes(s))}
async function openGame(d){document.getElementById('viewer').style.display='block';document.getElementById('gameTitle').textContent=d.n+'차시 · '+d.title;document.getElementById('status').textContent='게임 여는 중…';try{const binary=atob(d.b);const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));const raw=await new Response(stream).blob();if(currentURL)URL.revokeObjectURL(currentURL);currentURL=URL.createObjectURL(new Blob([raw],{type:'text/html;charset=utf-8'}));document.getElementById('frame').src=currentURL;document.getElementById('status').textContent='';}catch(e){document.getElementById('status').textContent='열기 실패: '+e.message}}
function closeGame(){document.getElementById('frame').src='about:blank';document.getElementById('viewer').style.display='none';if(currentURL){URL.revokeObjectURL(currentURL);currentURL=null}}
</script></html>
